# ══════════════════════════════════════════════════════════════
# Naukri Job Scheduler — GitHub Actions Workflow
# ══════════════════════════════════════════════════════════════

name: 🔍 Naukri Job Scheduler

on:
  schedule:
    # 9:00 AM IST
    - cron: "30 3 * * *"

    # 1:00 PM IST
    - cron: "30 7 * * *"

    # 6:00 PM IST
    - cron: "30 12 * * *"

  workflow_dispatch:
    inputs:
      force_send:
        description: "Send email even if no new jobs"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  scrape-and-notify:
    name: Scrape Naukri & Send Digest

    # IMPORTANT: Use Ubuntu 22.04
    runs-on: ubuntu-22.04

    timeout-minutes: 25

    steps:
      # ─────────────────────────────────────────────
      # Checkout repository
      # ─────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Clone & Setup Sibling Career-Ops
      # ─────────────────────────────────────────────
      - name: 🚀 Clone & Setup Sibling Career-Ops
        run: |
          git clone https://github.com/santifer/career-ops ../career-ops
          mkdir -p ../career-ops/config ../career-ops/templates ../career-ops/output ../career-ops/data
          # Copy our customized templates and profile configs from local backup
          cp config/career-ops/cv.md ../career-ops/cv.md
          cp config/career-ops/profile.yml ../career-ops/config/profile.yml
          # Seed empty applications tracker file
          echo "# Applications Tracker" > ../career-ops/data/applications.md
          # Seed default cv-template
          cp ../career-ops/examples/templates/cv-template.html ../career-ops/templates/cv-template.html || true

      # ─────────────────────────────────────────────
      # Setup Python
      # ─────────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ─────────────────────────────────────────────
      # Install Python dependencies
      # ─────────────────────────────────────────────
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────────────────────
      # Install Linux browser dependencies
      # ─────────────────────────────────────────────
      - name: 🖥️ Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libnss3 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64
      # ─────────────────────────────────────────────
      # Install Chromium ONLY
      # IMPORTANT:
      # DO NOT USE install-deps
      # ─────────────────────────────────────────────
      - name: 🎭 Install Chromium
        run: |
          python -m playwright install chromium

      # ─────────────────────────────────────────────
      # Download CloakBrowser stealth binary
      # ─────────────────────────────────────────────
      - name: 🥷 Pre-download CloakBrowser stealth binary
        run: |
          python -c "from cloakbrowser import ensure_binary; ensure_binary()"

      # ─────────────────────────────────────────────
      # Restore cache
      # ─────────────────────────────────────────────
      - name: 💾 Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ github.ref_name }}-

      # ─────────────────────────────────────────────
      # Create folders
      # ─────────────────────────────────────────────
      - name: 📁 Create output directories
        run: |
          mkdir -p data/results logs

      # ─────────────────────────────────────────────
      # Run scraper
      # ─────────────────────────────────────────────
      - name: 🔍 Run Naukri Job Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      # ─────────────────────────────────────────────
      # Upload artifacts
      # ─────────────────────────────────────────────
      - name: 📊 Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            data/results/
            logs/
          retention-days: 7

      # ─────────────────────────────────────────────
      # Save cache
      # ─────────────────────────────────────────────
      - name: 💾 Save seen jobs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-${{ github.ref_name }}-${{ github.run_id }}

      # ────────────────────────────────────────────
      # Workflow summary
      # ─────────────────────────────────────────────
      - name: 📋 Job Run Summary
        if: always()
        run: |
          echo "## 🔍 Naukri Job Scheduler Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Run: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time (UTC): $(date -u)" >> $GITHUB_STEP_SUMMARY