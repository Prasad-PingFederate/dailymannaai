# ══════════════════════════════════════════════════════════════
# Naukri Job Scheduler — Configuration
# ══════════════════════════════════════════════════════════════
# Copy this to config/config.yml and customize for your search.
# Sensitive values (email passwords) should be set as GitHub
# Secrets, not hardcoded here.
# ══════════════════════════════════════════════════════════════

# ── Your Profile ──────────────────────────────────────────────
profile:
  name: "Your Name"                    # Used in email greeting
  target_role: "Software Engineer"     # Shown in email header

# ── Search Queries ────────────────────────────────────────────
# Add multiple queries for different roles/locations.
# Each runs independently and results are merged + deduplicated.
search_queries:

  - keyword: "automation playwright"
    location: "bangalore"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["playwright", "automation", "sdet", "test"]
      title_exclude: ["sales", "manager"]
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "automation playwright"
    location: "chennai"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["playwright", "automation", "sdet", "test"]
      title_exclude: ["sales"]
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "automation playwright"
    location: "hyderabad"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["playwright", "automation", "sdet", "test"]
      title_exclude: ["sales"]
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "selenium automation"
    location: "bangalore"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["selenium", "automation", "java", "python", "test"]
      title_exclude: []
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "selenium automation"
    location: "hyderabad"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["selenium", "automation", "sdet"]
      title_exclude: []
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "manual testing"
    location: "bangalore"
    experience_years: 3
    enabled: true
    filters:
      title_include: ["manual", "functional", "qa", "test"]
      title_exclude: ["automation"]
      company_exclude: []
      min_salary_lpa: 0

  - keyword: "typescript automation"
    location: "remote"
    experience_years: 2
    enabled: true
    filters:
      title_include: ["typescript", "automation", "playwright", "cypress"]
      title_exclude: []
      company_exclude: []
      min_salary_lpa: 0

# ── Scraper Settings ──────────────────────────────────────────
scraper:
  headless: true                       # Always true for GitHub Actions
  slow_mo: 800                         # ms delay between actions (polite scraping)
  timeout: 45000                       # Page load timeout in ms
  max_pages: 3                         # Pages per query (25 jobs/page on Naukri)
  delay_between_pages: 3              # Seconds between page fetches

# ── Email / Notifications ─────────────────────────────────────
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587

  # ⚠️  DO NOT put real credentials here.
  # Leave as null — they are read from GitHub Secrets:
  #   EMAIL_SENDER   → your Gmail address
  #   EMAIL_PASSWORD → Gmail App Password (not your Gmail password!)
  sender_email: null
  sender_password: null

  # Who receives the digest (comma-separated in EMAIL_RECIPIENTS secret,
  # or list them here for non-sensitive addresses)
  recipients:
    - "prasad.dammai94@gmail.com"
    - "prasaddammai1@gmail.com"

notifications:
  email_enabled: true
  send_empty_digest: false             # Set true to email even when no new jobs

# ── Auto Apply Settings ───────────────────────────────────────
auto_apply:
  enabled: true                        # Set true to automatically generate tailored resumes and apply
  headless: false                      # Headless false to see CloakBrowser and support manual login if cookies expire
  update_profile_resume: true          # Set true to automatically upload and update the main Naukri profile resume with the generated one
  delay_between_applies: 45            # Seconds to wait between applying to each job (polite delay to simulate human and bypass bot detection)
