name: Naukri Job Scheduler

on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  scrape-and-notify:
    name: Scrape Naukri and Send Digest
    runs-on: ubuntu-22.04 # Pinning to Jammy for stability, but script is now dual-compatible
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r naukri-job-scheduler/requirements.txt

      - name: Install minimal browser dependencies
        run: |
          sudo apt-get update
            libasound2 || sudo apt-get install -y libasound2t64
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Pre-download CloakBrowser stealth binary
        run: |
          python -c "from cloakbrowser import ensure_binary; ensure_binary()"

      - name: Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ github.ref_name }}-

      - name: Create output directories
        run: mkdir -p data/results logs

      - name: Run Naukri Job Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd naukri-job-scheduler
          python main.py

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            data/results/
            logs/
          retention-days: 7
