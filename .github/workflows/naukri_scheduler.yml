name: Naukri Job Scheduler

on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  scrape-and-notify:
    name: Scrape Naukri and Send Digest
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Pre-download CloakBrowser stealth binary
        run: |
          python -c "from cloakbrowser import ensure_binary; ensure_binary()"

      - name: Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ github.ref_name }}-

      - name: Create output directories
        run: mkdir -p data/results logs

      - name: Run Naukri Job Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            data/results/
            logs/
          retention-days: 7
