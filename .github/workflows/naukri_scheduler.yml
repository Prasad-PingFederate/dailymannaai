name: 🔍 Naukri Job Scheduler

on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  scrape-and-notify:
    name: Scrape Naukri & Send Digest
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright & Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 💾 Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ github.ref_name }}-

      - name: 📁 Create output directories
        run: mkdir -p data/results logs

      - name: 🔍 Run Naukri Job Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: 📊 Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            data/results/
            logs/
          retention-days: 7
